services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pbn
      POSTGRES_USER: pbn
      POSTGRES_PASSWORD: pbn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pbn -d pbn" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://pbn:pbn@postgres:5432/pbn?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      REDIS_QUEUE_NAME: pbn:jobs
      QUEUE_MAX_SIZE: "20"
      MAX_ACTIVE_PROJECTS_PER_CLIENT: "2"
      STORAGE_ROOT: /storage
      PUBLIC_ID_LENGTH: "12"
      INTERNAL_API_SECRET: local-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/storage
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      REDIS_ADDR: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_QUEUE_NAME: pbn:jobs
      REDIS_EVENTS_CHANNEL: pbn:events
      WORKER_CONCURRENCY: "3"
      BACKEND_INTERNAL_BASE: http://backend:8080/api/internal
      INTERNAL_API_SECRET: local-dev-secret
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  storage_data:
