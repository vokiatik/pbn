server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Includes multipart overhead; comfortably below Cloudflare's 100 MB limit.
  client_max_body_size 26m;
  error_page 413 = @upload_too_large;
  client_body_timeout 60s;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Docker DNS must be resolved again after a backend container is replaced.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location @upload_too_large {
    default_type application/json;
    add_header Cache-Control 'no-store' always;
    return 413 '{"error":"Upload exceeds the 26 MiB request limit. Choose a smaller image."}';
  }

  location = /api/internal { return 404; }
  location ^~ /api/internal/ { return 404; }

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Internal-Secret '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control 'no-store' always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control 'no-cache' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }
}
