# Standalone production definition. Do not merge with docker-compose.yml,
# which publishes development ports. Coolify supplies routing/network labels.
x-service: &service
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *service
  user: "10001:10001"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,mode=1777

services:
  postgres:
    <<: *service
    image: postgres:16-alpine
    env_file:
      - ./deploy/env/postgres.env
    environment:
      # Generate a hex password; it is also interpolated into a URI below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pbn -d pbn"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  redis:
    <<: *service
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random hexadecimal Redis password}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set a random hexadecimal Redis password}
    command:
      - /bin/sh
      - -ec
      - 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  backend:
    <<: *app
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./deploy/env/backend.env
    environment:
      POSTGRES_DSN: postgres://pbn:${POSTGRES_PASSWORD}@postgres:5432/pbn?sslmode=disable
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random hexadecimal Redis password}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set a random internal API secret}
      ALLOWED_ORIGINS: ${APP_ORIGIN:?Set the public application origin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/storage
    healthcheck:
      test: [CMD, /bin/healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  pbn:
    <<: *app
    build:
      context: .
      dockerfile: pbn/Dockerfile
    env_file:
      - ./deploy/env/pbn.env
    volumes:
      - storage_data:/storage
    shm_size: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 65m

  worker:
    <<: *app
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - ./deploy/env/worker.env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random hexadecimal Redis password}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set a random internal API secret}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      pbn:
        condition: service_healthy
    volumes:
      - storage_data:/storage:ro
    healthcheck:
      test: [CMD, python, -m, worker.worker_app.healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 65m

  frontend:
    <<: *app
    user: "101:101"
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  storage_data:
